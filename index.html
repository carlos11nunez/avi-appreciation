<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avi Appreciation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root { --accent: #9cc2ff; --text: #e8edff; --muted: #b9c3e6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Cormorant Garamond", Georgia, serif; color: var(--text);
    background: linear-gradient(160deg, #2a0b20 0%, #1d0f2e 55%, #12183a 100%);
    background-attachment: fixed; min-height: 100vh;
    padding: clamp(2.5rem, 8vw, 5rem) 1.25rem;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  /* the eyes drift around behind everything; "screen" blending drops the canvas's black so only the eyes show */
  .peeker {
    position: fixed; z-index: -1; top: 0; left: 0; pointer-events: none;
    width: min(360px, 65vw); height: min(360px, 65vw);
    mix-blend-mode: screen; opacity: .6;
    transform: translateX(-100%);
  }
  .wrap { position: relative; }

  .letter {
    background: rgba(18, 16, 42, .6);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(156, 194, 255, .22);
    padding: clamp(1.5rem, 5vw, 2.5rem); border-radius: 16px;
  }
  .letter p { font-size: 1.15rem; line-height: 1.75; margin-bottom: 1rem; }
  .letter p:last-child { margin-bottom: 0; }
  .letter p.sign { text-align: right; margin-top: 1.5rem; color: var(--accent); }

  .photos {
    margin-top: 2rem;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem;
  }
  @media (max-width: 600px) { .photos { grid-template-columns: 1fr; } }   /* phones: one photo per row */
  .photos figure {
    aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden;
    border: 1px solid rgba(156, 194, 255, .22); background: rgba(18, 16, 42, .6);
  }
  .photos figure:has(.empty) { border: none; }
  .photos img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }   /* keep faces in frame on tall photos */
  .photos .empty {
    height: 100%; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-style: italic; font-size: 1.1rem;
    border: 2px dashed rgba(156, 194, 255, .3); border-radius: 12px;
  }

  /* ---------- animations ---------- */

  /* slow drifting glows behind everything */
  .glow { position: fixed; z-index: -1; border-radius: 50%; filter: blur(80px); opacity: .45; pointer-events: none; }
  .glow.a { width: 45vmax; height: 45vmax; background: #6b2a5a; top: -15vmax; left: -10vmax; animation: drift-a 22s ease-in-out infinite alternate; }
  .glow.b { width: 40vmax; height: 40vmax; background: #2c4c9c; bottom: -15vmax; right: -10vmax; animation: drift-b 26s ease-in-out infinite alternate; }
  @keyframes drift-a { to { transform: translate(18vw, 22vh) scale(1.15); } }
  @keyframes drift-b { to { transform: translate(-20vw, -18vh) scale(1.1); } }

  /* letter card rises in, then each paragraph follows */
  .title {
    font-weight: 600; font-size: clamp(2.2rem, 7vw, 3.4rem); text-align: center; letter-spacing: .02em;
    color: var(--accent); text-shadow: 0 0 24px rgba(156,194,255,.35); margin-bottom: 1.5rem;
    animation: rise-in 1s cubic-bezier(.2,.7,.2,1) both;
  }
  .letter { animation: rise-in 1s cubic-bezier(.2,.7,.2,1) both; position: relative; overflow: hidden; }
  .letter p { animation: rise-in .9s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise-in { from { opacity: 0; transform: translateY(24px) scale(.98); filter: blur(4px); } }

  /* photos pop in as you scroll to them, and lift on hover */
  .photos figure {
    opacity: 0; transform: translateY(40px) rotate(var(--tilt, 0deg)) scale(.92);
    transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1), box-shadow .3s ease;
  }
  .photos figure.in { opacity: 1; transform: rotate(var(--tilt, 0deg)); }
  .photos figure.in:hover { transform: translateY(-8px) rotate(0deg) scale(1.03); box-shadow: 0 18px 40px rgba(0,0,0,.45), 0 0 30px rgba(156,194,255,.25); transition-delay: 0s !important; }
  .photos img { transition: transform .6s ease; }
  .photos figure:hover img { transform: scale(1.07); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .photos figure { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<script>
  /* ============================================================
     ✏️  EDIT HERE
     ============================================================ */

  // Your message — one string per paragraph.
  const LETTER = [
    "Hey dude perhaps not what you were expecting when i told you i wanted to give u something, but we both know i kinda suck at this stuff so i guess i did it in the most cardo way possible 😭!!!",
    "But uhm back to the point, right uhm I just wanted to let yk how much u mean to me. You’re probably one of the only ppl i can rlly rely on yk youre always there even when im being an asshole and i really appreciate that you mean sosososo much to me buddy.",
    "Uhm like kinda jus going of da feels rn but your one of my closest peeps and im forever grateful to have someone like you around. You mean sm to me more than youll ever ever know and ur da best buddy.",
    "You’re my best friend dude god knows where id be without avi love u dude!!",
  ];
  const SIGN_OFF = "Cardo";   // set to "" to hide it

  // Your photos — put the image files in a folder called "photos" next to this file,
  // then list their file names here. Any photo that can't be found shows an empty frame.
  const PHOTOS = [
    "photos/1.jpg",
    "photos/2.jpg",
    "photos/3.jpg",
  ];
</script>

<div class="glow a" aria-hidden="true"></div>
<div class="glow b" aria-hidden="true"></div>
<canvas class="peeker" data-side="left" width="466" height="466" aria-hidden="true"></canvas>
<canvas class="peeker" data-side="right" width="466" height="466" aria-hidden="true"></canvas>

<div class="wrap">
  <h1 class="title">Avi Appreciation</h1>
  <article class="letter" id="letter"></article>
  <section class="photos" id="photos" aria-label="Photos"></section>
</div>

<script>
  const letter = document.getElementById("letter");
  LETTER.forEach((text, i) => {
    const p = document.createElement("p");
    p.style.animationDelay = `${0.5 + i * 0.35}s`;
    p.textContent = text;
    letter.appendChild(p);
  });
  if (SIGN_OFF) {
    const s = document.createElement("p");
    s.className = "sign";
    s.style.animationDelay = `${0.5 + LETTER.length * 0.35}s`;
    s.textContent = SIGN_OFF;
    letter.appendChild(s);
  }

  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { threshold: 0.2 });

  PHOTOS.forEach((src, i) => {
    const fig = document.createElement("figure");
    fig.style.setProperty("--tilt", `${(i % 2 ? 1 : -1) * (1 + Math.random() * 1.5)}deg`);  // slight polaroid tilt
    fig.style.transitionDelay = `${(i % 3) * 0.15}s`;
    io.observe(fig);
    const img = document.createElement("img");
    img.src = src;
    img.alt = "";
    img.loading = "lazy";
    img.onerror = () => { fig.innerHTML = '<div class="empty">add a photo</div>'; };
    fig.appendChild(img);
    document.getElementById("photos").appendChild(fig);
  });
</script>
<script src="eyes.js"></script>
<script>
  // One pair of eyes per side: each peeks in, stares toward the letter, ducks out,
  // and comes back with a different style every time.
  const STYLES = ["CAT", "WIDE", "SHOCKED", "ROUND", "STARP", "DOME", "SLAB", "GOOGLY", "FIRE"];
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const showing = {};   // side -> style currently on screen, so the two sides never match

  // shown = how much of the canvas is on screen (0 hidden, 1 fully)
  function place(el, side, shown, y, secs) {
    const w = el.offsetWidth;
    const x = side === "left" ? -w * (1 - shown) : innerWidth - w * shown;
    el.style.transition = secs ? `transform ${secs}s cubic-bezier(.3,.7,.2,1)` : "none";
    el.style.transform = `translate(${x}px, ${y}px)`;
  }

  function nextStyle(side, other) {
    const choices = STYLES.filter((s) => s !== showing[side] && s !== showing[other]);
    return choices[Math.floor(Math.random() * choices.length)];
  }

  async function peekLoop(el, eyes, side, firstDelay) {
    const other = side === "left" ? "right" : "left";
    const toMiddle = side === "left" ? 0.9 : -0.9;
    place(el, side, 0, 0, 0);
    await wait(firstDelay);
    for (;;) {
      showing[side] = nextStyle(side, other);
      eyes.setStyle(showing[side]);
      const y = rnd(0.03, 0.6) * Math.max(0, innerHeight - el.offsetHeight * 0.6);
      place(el, side, 0, y, 0);
      el.offsetWidth;                                       // apply the hidden spot before animating in
      place(el, side, 0.32, y, 1.6);                        // one eye sneaks in...
      eyes.lookAt(toMiddle, rnd(-0.2, 0.3));
      await wait(rnd(1800, 2600));
      place(el, side, 0.62, y, 1.4);                        // ...then both, for a proper look
      eyes.lookAt(toMiddle, rnd(-0.2, 0.3));
      await wait(rnd(3500, 5500));                          // eyes.js lets them glance around
      place(el, side, 0, y, 0.7);                           // duck back out
      await wait(rnd(2500, 6000));
    }
  }

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.querySelectorAll(".peeker").forEach((el, i) => {
    const side = el.dataset.side;
    const eyes = makeEyes(el, STYLES[i]);
    if (reduced) place(el, side, 0.62, innerHeight * (0.1 + i * 0.4), 0);
    else peekLoop(el, eyes, side, i ? rnd(3000, 5000) : 300);   // the right side starts a bit later
  });
</script>
</body>
</html>
